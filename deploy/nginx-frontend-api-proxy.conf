# Frontend EC2 의 Nginx 에서 /api 를 Backend a/b 로 분산하는 경우에만 사용한다.
# (ALB 경로 규칙 /api/* -> tg-coupon-api 를 쓰면 이 파일은 필요 없다. README 참고)
#
# 배치: /etc/nginx/conf.d/coupon-api-upstream.conf  (http 블록 안에 include 됨)
#       그리고 기존 server 블록 안에 아래 location 두 개를 추가한다.
# 보안 그룹: sg-api 인바운드에 TCP 8000 <- sg-web 추가 필요

upstream coupon_api {
    least_conn;
    # Backend EC2 사설 IP 로 교체
    server 10.0.10.11:8000 max_fails=2 fail_timeout=10s;   # backend-a (Private-a)
    server 10.0.11.11:8000 max_fails=2 fail_timeout=10s;   # backend-b (Private-b 권장)
    keepalive 32;
}

